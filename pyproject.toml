[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "util_bbdd"
version = "4.5.0"
description = "Librería de operaciones de base de datos: CRUD en lote, auditoría, conexiones pooled y documentación."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Paco Manzano", email = "fmanzano.trabajo@gmail.com"}
]
keywords = ["database", "crud", "bulk", "audit", "mysql", "oracle", "mariadb", "postgresql", "sqlite", "sqlserver", "async", "compare", "document", "documentation", "sqlalchemy", "pandas", "openpyxl", "python-docx", "oracledb", "jinja2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "sqlalchemy>=2.1",
    "pandas>=3.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Drivers de base de datos: opcionales, se instalan solo los de los motores que se usen.
oracle = [
    "oracledb>=26",  # sync y async (modo thin; thick con Oracle Instant Client)
]
mariadb = [
    "mariadb>=1.1",   # MariaDB Connector/Python (sync)
    "aiomysql>=0.3",  # async
]
mysql = [
    "pymysql[rsa]>=1.2",  # sync; [rsa] = cryptography, necesario para caching_sha2_password sin TLS
    "aiomysql>=0.3",      # async
]
postgresql = [
    "psycopg[binary]>=3.3",  # sync (psycopg 3: conexión directa y Engine postgresql+psycopg)
    "psycopg-pool>=3.3",     # pool sync
    "asyncpg>=0.32",         # async
]
# SQL Server: pymssql es el driver por defecto (wheels con FreeTDS incluido); sqlserver-odbc, el alternativo (requiere el
# ODBC Driver for SQL Server del sistema). Desde 4.1.0 (util_bbdd_web G3).
sqlserver = [
    "pymssql>=2.4",
]
sqlserver-odbc = [
    "pyodbc>=5.2",   # sync
    "aioodbc>=0.5",  # async
]
# HSQLDB: JDBC desde Python; requiere Java 8+ y el JAR de HSQLDB. Sin async.
hsqldb = [
    "JayDeBeApi>=1.2",
]
# SQLite async (el driver sync es sqlite3, de la biblioteca estándar).
sqlite-async = [
    "aiosqlite>=0.22",
]
# migrate: reescribe el SQL de las vistas al dialecto destino (MigrationPlanner(view_strategy="auto"|"transpile")).
migrate = [
    "sqlglot>=30,<31",
]
analysis = [
    "graphviz>=0.21",
]
# MatplotlibRelationshipGraph (analysis/matplotlib_graph.py); sin estos paquetes el resto de la librería funciona igual.
analysis-matplotlib = [
    "matplotlib>=3.11",
    "networkx>=3.7",
]
doc-svg = [
    "cairosvg>=2.9",
]
# Drivers que solo usan los tests (SQL Server por ODBC y pymssql, SQLAlchemy async); no son extras de la librería.
test-drivers = [
    "pyodbc>=5.2",
    "aioodbc>=0.5",
    "pymssql>=2.4",
    "sqlalchemy[asyncio]>=2.1",  # greenlet
]
# Entorno de referencia (CI y recuentos de tests/mypy): sin él, unos 95 tests fallan por drivers que faltan.
# Además necesita del sistema Graphviz (`dot`) y, en Linux, libmariadb-dev para compilar el conector de MariaDB.
dev-full = [
    "util_bbdd[dev,docs,oracle,mariadb,mysql,postgresql,migrate,analysis,analysis-matplotlib,test-drivers]",
]
dev = [
    "build>=1.6",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "pytest-asyncio>=1.4",
    "aiosqlite>=0.22",
    "ruff>=0.17",
    "mypy>=2.4",
    "black>=26.10",
    "isort>=9.0",
    # Con tope: cada pandas-stubs nueva puede romper mypy en el CI sin cambios propios (3.0.5 lo hizo en 4.0.0).
    # Se sube a mano, comprobando `mypy src` con la versión nueva.
    "pandas-stubs>=3.0.5,<3.1",
    "types-networkx",
    "types-PyMySQL",
    "types-openpyxl",
    "sqlglot>=30,<31",
    # Tests de la estrategia execute_values (postgresql+psycopg2): sin él se saltan 3 módulos y 20 tests.
    "psycopg2-binary>=2.9",
    # Tests de conexión, bulk y metadata de Oracle (con mocks del driver): sin él se saltan.
    "oracledb>=26",
]
docs = [
    # Generadores compatibles (ambos leen el mismo mkdocs.yml):
    #   - zensical: generador por defecto (CI usa `zensical build`)
    #   - mkdocs-material: generador clásico, compatibilidad recíproca (`mkdocs build`)
    "zensical>=0.0.71",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[project.urls]
Homepage = "https://github.com/fmanza/util_bbdd"
Documentation = "https://fmanza.github.io/util_bbdd/"
Repository = "https://github.com/fmanza/util_bbdd.git"
"Bug Tracker" = "https://github.com/fmanza/util_bbdd/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
util_bbdd = [
    "py.typed",
    "doc/templates/**/*.j2",
    "doc/data/**/*.json",
    "doc/data/html_assets/*.js",
    "doc/data/html_assets/*.css",
    "doc/data/html_assets/icons/*.svg",
    "comparar/reporters/templates/**/*.j2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

#[tool.ruff.isort]
#known-first-party = ["util_bbdd"]
#combine-as-imports = true

[tool.ruff.lint]
# `select` (no `extend-select`): ruff 0.17 amplió las reglas por defecto y `extend-select` las sumaría todas.
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Fuerza a que todos los imports de una misma sección estén juntos
combine-as-imports = true

# Define qué nombres de carpetas debe tratar como "locales"
# (Cámbialo por el nombre de tu carpeta de código principal)
known-first-party = ["util_bbdd"]

# Si prefieres una línea por cada import 'from'
force-single-line = false

# Añade líneas en blanco automáticas entre secciones
lines-between-types = 1

[tool.ruff.format]
# Ajustes de formato tipo 'Black'
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"  # Versión mínima soportada; mypy es retrocompatible con 3.13+
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
# Uso de APIs marcadas con @deprecated en typeshed o en las dependencias (desactivado por defecto en mypy).
enable_error_code = ["deprecated"]
# docs_build_plugin.py es un plugin de MkDocs (herramienta de documentación, no la librería) y depende de mkdocs, que los
# extras `dev` no instalan: no se comprueba al recorrer src/. Con una ejecución explícita sí, de ahí el override de abajo.
exclude = ['(^|/)docs_build_plugin\.py$']

# doc/ y analysis/ no admiten genéricos sin parámetros (`list`, `tuple`, `dict` a secas): se limpiaron en 0.41.x
# (sesión 2026-10-09l, P6) y así no vuelven. Las llamadas sin tipos de python-docx siguen permitidas.
[[tool.mypy.overrides]]
module = ["util_bbdd.doc.*", "util_bbdd.analysis.*"]
disallow_any_generics = true

# Los métodos públicos de BulkCrud llevan @medir_tiempo: un decorador mal tipado los convierte en Any para quien usa la
# librería (pasó hasta 3.0.3 con util.timing). Así no vuelve.
[[tool.mypy.overrides]]
module = ["util_bbdd.bulk.crud"]
disallow_any_decorated = true

[[tool.mypy.overrides]]
module = [
    "pymssql",
    "pyodbc",
    "aioodbc",
    "psycopg",
    "psycopg_pool",
    "asyncpg",
    "mariadb",
    "aiomysql",
    "jaydebeapi",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cairosvg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["mkdocs", "mkdocs.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "graphviz",
    "matplotlib",
    "matplotlib.*",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true

[project.entry-points."mkdocs.plugins"]
documentation_zip = "util_bbdd.docs_build_plugin:DocumentationZipPlugin"
