[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "util_bbdd"
version = "0.1.0"
description = "Librería de operaciones de base de datos: CRUD en lote, auditoría, conexiones pooled y documentación."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Francisco", email = "developer@example.com"}
]
keywords = ["database", "crud", "bulk", "audit", "mysql", "oracle", "mariadb"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]

dependencies = [
    "sqlalchemy>=2.0",
    "pandas>=2.3",
    "openpyxl>=3.1",
    "python-docx>=1.2",
    "oracledb>=3.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "black>=23.0",
    "isort>=5.12",
]
docs = [
    "sphinx>=6.0",
    "sphinx-rtd-theme>=1.2",
]

[project.urls]
Homepage = "https://github.com/tu_org/util_bbdd"
Documentation = "https://util-bbdd.readthedocs.io"
Repository = "https://github.com/tu_org/util_bbdd.git"
"Bug Tracker" = "https://github.com/tu_org/util_bbdd/issues"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
util_bbdd = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = ["E501"]

[tool.ruff.isort]
known-first-party = ["util_bbdd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/util_bbdd --cov-report=html --cov-report=term-missing -v"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = "oracledb.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openpyxl.*"
ignore_missing_imports = true
