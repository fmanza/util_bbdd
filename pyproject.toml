[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "util_bbdd"
version = "0.10.0"
description = "Librería de operaciones de base de datos: CRUD en lote, auditoría, conexiones pooled y documentación."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    {name = "Paco Manzano", email = "fmanzano.trabajo@gmail.com"}
]
keywords = ["database", "crud", "bulk", "audit", "mysql", "oracle", "mariadb", "postgresql", "sqlite", "sqlserver", "async", "compare", "document", "documentation", "sqlalchemy", "pandas", "openpyxl", "python-docx", "oracledb", "jinja2"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

dependencies = [
    "sqlalchemy>=2.0.46",
    "pandas>=3.0.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.2.0",
    "oracledb>=3.4.0",
    "jinja2>=3.0.0",
    "util @ git+https://github.com/fmanza/util.git@develop",
]

[project.optional-dependencies]
analysis = [
    "graphviz>=0.20",
]
doc-svg = [
    "cairosvg>=2.7",
]
dev = [
    "build>=1.2",
    "pytest>=9.0",
    "pytest-cov>=7.0",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.22",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "black>=23.0",
    "isort>=5.12",
    "pandas-stubs",
    "types-networkx",
]
docs = [
    "zensical>=0.0.44",
]

[project.urls]
Homepage = "https://github.com/fmanza/util_bbdd"
Documentation = "https://fmanza.github.io/util_bbdd/"
Repository = "https://github.com/fmanza/util_bbdd.git"
"Bug Tracker" = "https://github.com/fmanza/util_bbdd/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages]
find = {where = ["src"]}

[tool.setuptools.package-data]
util_bbdd = [
    "py.typed",
    "doc/templates/**/*.j2",
    "doc/data/**/*.json",
    "doc/data/html_assets/*.js",
    "doc/data/html_assets/*.css",
    "doc/data/html_assets/icons/*.svg",
    "comparar/reporters/templates/**/*.j2",
]

[tool.ruff]
line-length = 120
target-version = "py312"

#[tool.ruff.isort]
#known-first-party = ["util_bbdd"]
#combine-as-imports = true

[tool.ruff.lint]
extend-select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
# Fuerza a que todos los imports de una misma sección estén juntos
combine-as-imports = true

# Define qué nombres de carpetas debe tratar como "locales"
# (Cámbialo por el nombre de tu carpeta de código principal)
known-first-party = ["util_bbdd"]

# Si prefieres una línea por cada import 'from'
force-single-line = false

# Añade líneas en blanco automáticas entre secciones
lines-between-types = 1

[tool.ruff.format]
# Ajustes de formato tipo 'Black'
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["oracledb", "oracledb.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "pymssql",
    "pyodbc",
    "aioodbc",
    "psycopg",
    "psycopg_pool",
    "asyncpg",
    "mariadb",
    "aiomysql",
    "jaydebeapi",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cairosvg"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "graphviz",
    "matplotlib",
    "matplotlib.*",
    "util.timing.medir_tiempo",
]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["pandas", "pandas.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["networkx", "networkx.*"]
ignore_missing_imports = true
