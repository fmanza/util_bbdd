name: Docs

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - "zensical.toml"
      - "src/**/*.py"
      - "pyproject.toml"
  pull_request:
    paths:
      - "docs/**"
      - "zensical.toml"
      - "src/**/*.py"
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & validate
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build docs (validate)
        # Zensical es el único generador (zensical.toml); --strict convierte los avisos en error.
        run: zensical build --strict
        env:
          PYTHONPATH: src

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      # Cada job corre en una máquina nueva: el site/ del job build no llega aquí.
      - name: Build docs
        run: zensical build
        env:
          PYTHONPATH: src

      # El ZIP offline no es un plugin (Zensical no ejecuta plugins de MkDocs): se añade al sitio tras el build.
      - name: Add offline ZIP to site
        run: python scripts/build_docs_zip.py --no-build --in-site

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          force_orphan: true
