name: Docs Release ZIP

# Triggered automatically on version tags (v*) and manually via workflow_dispatch.
# Builds the documentation site and uploads a ZIP to the GitHub Release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag / version to attach the ZIP to (e.g. v0.10.0)"
        required: false

concurrency:
  group: docs-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-upload:
    name: Build docs ZIP & upload to release
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create/update GitHub Releases

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install docs dependencies
        run: pip install -e ".[docs]"

      - name: Build docs & create ZIP
        run: |
          mkdir -p dist
          python scripts/build_docs_zip.py --builder zensical --output-dir dist
        env:
          PYTHONPATH: src

      - name: Debug - List generated files
        run: |
          echo "📦 Contents of dist/:"
          ls -lah dist/ || echo "dist/ is empty or doesn't exist"
          echo ""
          echo "📦 Contents of site/:"
          ls -lah site/ | head -20 || echo "site/ is empty or doesn't exist"

      - name: Upload ZIP to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/util_bbdd-docs-*.zip,dist/util_bbdd-docs-*.sha256
          fail_on_unmatched_files: false
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
