name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: pip

    # Paquetes del sistema del entorno de referencia (extra dev-full): Graphviz (`dot`) para grafos y documentación;
    # en Linux, libmariadb-dev para compilar el conector de MariaDB (sin wheels) y unixodbc para pyodbc.
    - name: System packages (Ubuntu)
      if: runner.os == 'Linux'
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz libmariadb-dev unixodbc

    - name: System packages (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install graphviz --no-progress -y
        "C:\Program Files\Graphviz\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    # Entorno de referencia completo: con solo .[dev] unos 95 tests fallan por drivers que faltan.
    - name: Install dependencies
      shell: bash
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -e ".[dev-full]" || {
          echo "ERROR: Failed to install dependencies"
          python -m pip install -e ".[dev-full]" --verbose
          exit 1
        }

    - name: Lint with ruff
      run: python -m ruff check src/ tests/

    # Además de src/ se comprueba el fichero de conformidad: verifica con mypy (tipos, aridad y miembros) que las
    # implementaciones reales cumplen los Protocols que las capas altas usan en lugar de importarlas (Regla #6).
    # `mypy src` por sí solo no lo ve, porque los objetos se pasan desde los tests.
    - name: Type check with mypy
      run: python -m mypy src tests/unit/test_protocol_conformance.py

    - name: Run tests
      run: python -m pytest tests/ -v --cov=src/util_bbdd --cov-report=xml

    - name: Upload coverage
      if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
      uses: codecov/codecov-action@v7
      with:
        files: ./coverage.xml
        fail_ci_if_error: false

  package:
    runs-on: ubuntu-latest
    needs: test

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.12"
        cache: pip

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install -e ".[dev]" || {
          echo "ERROR: Failed to install dependencies"
          python -m pip install -e ".[dev]" --verbose
          exit 1
        }

    - name: Build package
      run: python -m build
