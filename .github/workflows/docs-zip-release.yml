name: Build and Publish Docs ZIP

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs-zip-release.yml'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build Docs and Publish ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: Build documentation
        run: |
          zensical build --strict
          echo "Documentation built successfully"

      - name: Generate ZIP and Checksums
        run: |
          mkdir -p dist
          python scripts/build_docs_zip.py --builder zensical --output-dir dist
          echo "ZIP and checksums generated"
          ls -lh dist/ || echo "dist/ directory appears empty"

      - name: Display checksums for verification
        run: |
          echo "Directory contents:"
          ls -la dist/ || echo "dist/ does not exist"
          echo ""
          echo "CHECKSUMS.txt content:"
          [ -f dist/CHECKSUMS.txt ] && cat dist/CHECKSUMS.txt || echo "No CHECKSUMS.txt found"
          echo ""
          echo "SHA256 file:"
          [ -f dist/*.sha256 ] && cat dist/*.sha256 || echo "No .sha256 file found"

      - name: Upload ZIP as artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-zip-build
          path: dist/
          retention-days: 30
        if: success()

      - name: Extract version and prepare release
        id: release_info
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

          if [ -f "dist/util_bbdd-docs-${VERSION}.zip.sha256" ]; then
            SHA256=$(head -1 dist/util_bbdd-docs-${VERSION}.zip.sha256 | awk '{print $1}')
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
          else
            echo "sha256=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "docs-v${{ steps.release_info.outputs.version }}"
          name: "Documentation Offline v${{ steps.release_info.outputs.version }}"
          artifacts: "dist/util_bbdd-docs-*.zip,dist/util_bbdd-docs-*.zip.sha256,dist/CHECKSUMS.txt"
          artifactErrorsFailBuild: false
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          body: |
            Documentation Offline Package
            Version: ${{ steps.release_info.outputs.version }}
            Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
