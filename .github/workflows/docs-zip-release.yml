name: 📦 Build & Publish Docs ZIP

on:
  push:
    branches:
      - main
      - develop
    # Solo si hay cambios en docs/
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'pyproject.toml'
      - '.github/workflows/docs-zip-release.yml'
  workflow_dispatch:  # Ejecutar manualmente desde GitHub UI

jobs:
  build-and-publish:
    name: Build Docs & Publish ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Para crear releases

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for versioning

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      - name: 🏗️ Build documentation (Zensical)
        run: |
          zensical build --strict
          echo "✅ Documentation built successfully"

      - name: 📚 Generate ZIP + Checksums
        run: |
          mkdir -p dist
          python scripts/build_docs_zip.py --builder zensical --output-dir dist
          echo "✅ ZIP and checksums generated"
          # Show the generated files
          ls -lh dist/ || echo "⚠️ dist/ directory appears empty"

      - name: 🔐 Display checksums for verification
        run: |
          echo "📋 Directory contents:"
          ls -la dist/ || echo "dist/ does not exist"
          echo ""
          echo "📋 CHECKSUMS.txt content:"
          [ -f dist/CHECKSUMS.txt ] && cat dist/CHECKSUMS.txt || echo "⚠️ No CHECKSUMS.txt found"
          echo ""
          echo "🔒 SHA256 file:"
          [ -f dist/*.sha256 ] && cat dist/*.sha256 || echo "⚠️ No .sha256 file found"

      - name: "📤 Upload ZIP as artifact (retention: 30 days)"
        uses: actions/upload-artifact@v4
        with:
          name: docs-zip-build
          path: dist/
          retention-days: 30
        if: success()

      - name: 📋 Extract version and prepare release
        id: release_info
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.loads(open('pyproject.toml').read())['project']['version'])")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📌 Version: $VERSION"

          # Get SHA256 safely
          if [ -f "dist/util_bbdd-docs-${VERSION}.zip.sha256" ]; then
            SHA256=$(head -1 dist/util_bbdd-docs-${VERSION}.zip.sha256 | awk '{print $1}')
            echo "sha256=$SHA256" >> $GITHUB_OUTPUT
            echo "🔐 SHA256: $SHA256"
          else
            echo "⚠️ SHA256 file not found for version $VERSION"
            echo "sha256=unknown" >> $GITHUB_OUTPUT
          fi

      - name: 🏷️ Create or update GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: "docs-v${{ steps.release_info.outputs.version }}"
          name: "📚 Documentation Offline v${{ steps.release_info.outputs.version }}"
          artifacts: "dist/util_bbdd-docs-*.zip,dist/util_bbdd-docs-*.zip.sha256,dist/CHECKSUMS.txt"
          artifactErrorsFailBuild: false
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: false
          body: |
            ## 📚 Documentation Offline Package

            **Version**: ${{ steps.release_info.outputs.version }}
            **Commit**: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})

            ### 📦 Contents

            - ✅ Complete HTML documentation with search
            - ✅ Mermaid diagrams (rendered)
            - ✅ Code examples and API reference
            - ✅ Offline search capability
            - ✅ Responsive design (mobile-friendly)

            ### 🔐 Integrity Verification

            **SHA256**: `${{ steps.release_info.outputs.sha256 }}`

            To verify the download integrity:
            ```bash
            sha256sum util_bbdd-docs-*.zip
            # Compare the output with the SHA256 above
            ```

            ### 🚀 How to Use

            1. Download the ZIP file below
            2. Extract: `unzip util_bbdd-docs-*.zip`
            3. Run `python start-server.py` in the extracted folder (opens http://localhost:8000 with offline search)
            4. Without the server, `index.html` opens directly but search is disabled (see README_OFFLINE.txt)

            ### 📖 Related Links

            - 🌐 [Online Documentation](https://fmanza.github.io/util_bbdd/)
            - 📦 [PyPI Package](https://pypi.org/project/util-bbdd/)
            - 💻 [Source Code](https://github.com/fmanza/util_bbdd)
            - 📋 [Downloads Page](https://fmanza.github.io/util_bbdd/downloads)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: ✅ Release published successfully
        run: |
          echo "🎉 Release created/updated: docs-v${{ steps.release_info.outputs.version }}"
          echo "📥 Download: https://github.com/fmanza/util_bbdd/releases/tag/docs-v${{ steps.release_info.outputs.version }}"

      - name: 📢 Notify on failure
        if: failure()
        run: |
          echo "❌ Build or release failed. Check the logs above."
          exit 1
