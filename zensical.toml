# Configuración de la documentación de util_bbdd (Zensical, formato nativo).
#
# Fuente única del sitio: Zensical es el único generador (`zensical build --strict` / `zensical serve`).
# Referencia de claves: https://zensical.org/docs/setup/basics/ — plantilla de `zensical new`.
# El ZIP offline no es un plugin: lo genera `scripts/build_docs_zip.py` después del build.

[project]
site_name = "util_bbdd"
site_description = "Librería Python para operaciones con múltiples motores de BD (sync/async): CRUD en lote, migración DDL, comparación de esquemas, documentación automática — MariaDB, MySQL, Oracle, PostgreSQL, SQLite, SQL Server, HSQLDB"
site_author = "Paco Manzano"
site_url = "https://fmanza.github.io/util_bbdd/"
repo_url = "https://github.com/fmanza/util_bbdd"
repo_name = "fmanza/util_bbdd"
docs_dir = "docs"
site_dir = "site"

# Mermaid local (la misma versión que Zensical cargaría de unpkg): con window.mermaid definido, Zensical no va a
# Internet, así que los diagramas se dibujan también en el ZIP offline. Al subir Zensical, igualar la versión
# (ZENSICAL.md § «Actualizar Zensical»). Licencia MIT en assets/js/vendor/mermaid-LICENSE.txt.
extra_javascript = [
  "assets/js/vendor/mermaid-12.3.0.min.js",
  "assets/js/sidebar-toggle.js",
]
extra_css = [
  "assets/css/mermaid.css",
  "assets/css/nav.css",
  "assets/css/arquitectura-capas.css",
]

