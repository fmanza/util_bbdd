# Zenical Configuration for util_bbdd
# Migrated from mkdocs.yml to zensical.toml
# Date: 2026-06-04

site_name = "util_bbdd"
site_url = "https://fmanza.github.io/util_bbdd/"
site_description = "Librería Python para operaciones con múltiples motores de BD (sync/async): CRUD en lote, migración DDL, comparación de esquemas, documentación automática — MariaDB, MySQL, Oracle, PostgreSQL, Redshift, Snowflake, SQLite, SQL Server, HSQLDB"
site_author = "Paco Manzano"
repo_url = "https://github.com/fmanza/util_bbdd"
repo_name = "fmanza/util_bbdd"
language = "es"

[build]
docs_dir = "docs"
site_dir = "site"

[theme]
name = "material"
icon_repo = "fontawesome/brands/github"

# Light mode (default)
[[theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
icon_toggle = "material/brightness-7"
name_toggle = "Cambiar a modo oscuro"

# Dark mode
[[theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
icon_toggle = "material/brightness-4"
name_toggle = "Cambiar a modo claro"

[theme.features]
navigation_tabs = true
navigation_sticky_tabs = true
navigation_top = true
navigation_footer = true
content_code_copy = true
content_code_annotate = true
content_tabs_link = true
search_highlight = true
search_suggest = true
toc_follow = true

[search]
lang = "es"

[markdown]
extensions = [
    "admonition",
    "pymdownx.details",
    "pymdownx.superfences",
    "pymdownx.emoji",
    "pymdownx.highlight",
    "pymdownx.inlinehilite",
    "pymdownx.tabbed",
    "tables",
    "toc"
]

