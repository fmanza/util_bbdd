# ── Tema ─────────────────────────────────────────────────────────────────────────────────────────
[project.theme]
language = "es"
features = [
  "content.code.annotate",
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.tabs",
  "navigation.tabs.sticky",
  "navigation.top",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/sun"
toggle.name = "Cambiar a modo oscuro"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "indigo"
accent = "blue"
toggle.icon = "lucide/moon"
toggle.name = "Cambiar a modo claro"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/fmanza/util_bbdd"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/util-bbdd/"

# ── Markdown ─────────────────────────────────────────────────────────────────────────────────────
[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.emoji.emoji_generator = "zensical.extensions.emoji.to_svg"
pymdownx.emoji.emoji_index = "zensical.extensions.emoji.twemoji"
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
# Los ejemplos de docs/examples/*.md incluyen su .py con --8<-- "examples/<nombre>.py".
pymdownx.snippets.base_path = ["docs"]
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true

# ── API de referencia (docs/api/*_autodoc.md, directivas «::: util_bbdd...») ─────────────────────
[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_source = true
show_root_heading = true
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true
merge_init_into_class = true
members_order = "source"
filters = ["!^_"]
